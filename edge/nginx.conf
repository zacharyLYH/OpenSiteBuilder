events {}

http {
  # Coarse edge limit for the API; the backend also limits per client IP.
  limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

  upstream frontend {
    server frontend:80;
  }

  upstream backend {
    server backend:18081;
  }

  server {
    listen 80;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;
      add_header X-Content-Type-Options nosniff always;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
      proxy_pass http://backend/healthz;
      proxy_set_header Host $host;
    }

    location / {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
