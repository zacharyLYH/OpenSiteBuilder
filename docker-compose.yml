services:
  edge:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    # Root context: the publish payload ships template/package.json (+ lock) as
    # raw text, so the image needs both frontend/ and template/.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"

  backend:
    build: ./backend
    expose:
      - "18081"
    env_file:
      - .env
    environment:
      ADDR: ":18081"
      PRIVATE_KEY_PATH: /run/secrets/dev.pem
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9999}
    volumes:
      - ./secrets:/run/secrets:ro
